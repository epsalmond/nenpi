[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nenpi"
version = "0.1.0"
description = "Measure what Claude Code and Codex CLI sessions cost in subscription quota"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Eric Psalmond" }]
dependencies = []

[project.optional-dependencies]
ui = ["textual>=0.50; python_version >= '3.11'"]
browser = [
    "textual>=0.50; python_version >= '3.11'",
    "textual-serve>=1.1; python_version >= '3.11'",
]

[project.scripts]
nenpi = "nenpi.drain:main"
nenpi-bench = "nenpi.bench:main"
nenpi-ui = "nenpi.tui:main"
nenpi-web = "nenpi.tui:web_main"

[project.urls]
Homepage = "https://github.com/epsalmond/nenpi"

[tool.setuptools.packages.find]
where = ["src"]
