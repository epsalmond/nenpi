[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nenpi"
version = "0.1.0"
description = "Measure what Claude Code and Codex CLI sessions cost in subscription quota"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Eric Psalmond" }]
dependencies = []

[project.scripts]
nenpi = "nenpi.drain:main"
nenpi-bench = "nenpi.bench:main"

[project.urls]
Homepage = "https://github.com/epsalmond/nenpi"

[tool.setuptools.packages.find]
where = ["src"]
