name: UI tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  textual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run tests with the UI extra
        run: uv run --python 3.13 --extra ui python -m unittest discover -s tests -v
